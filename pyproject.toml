[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "unified-trading-api"
dynamic = ["version"]
description = "Consolidated FastAPI serving all domain data for the Unified Trading System UIs"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}

dependencies = [
    # Pinned to safe versions (CVE-2026-{34073,39892,44431,44432,28684})
    "cryptography>=47.0.0,<50.0.0",
    "urllib3>=2.7.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    # Lazy-imported in routes/chat.py; pinned for CVE-2026-{34450,34452}
    "anthropic>=0.87.0,<1.0.0",
    # Web framework
    "fastapi>=0.137.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "pydantic>=2.12.5,<3.0.0",
    # Auth
    "google-auth>=2.40.0,<3.0.0",
    # Metrics
    "prometheus-client>=0.20.0,<1.0.0",
    # HTTP client (proxy to deployment-api)
    "httpx>=0.28.1,<1.0.0",
    # WebSocket
    "websockets>=14.0,<15.0.0",
    # Internal libraries
    "unified-trading-library>=0.65.0,<1.0.0",
    "unified-api-contracts>=0.80.0,<1.0.0",
    # Test / QG
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "pip>=26.1.2",  # PYSEC-2026-196 (pip transitive via pip-audit/pip-api; fix=26.1.2)
    "bandit>=1.7.0,<2.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "cryptography>=47.0.0,<50.0.0",
    "pygments>=2.20.0,<3.0.0",
    "requests>=2.33.0,<3.0.0",
    "aiohttp>=3.14.1,<4.0.0",
]

[project.scripts]
unified-trading-api = "unified_trading_api.main:main"

[tool.uv]
# Transitive security pin (pip-audit) — keep at or above fix version. starlette is pulled in
# transitively via fastapi (and UTL's own starlette<1.3.0 pin); fastapi<0.137.0 only requires
# starlette>=1.1.0 so a plain re-lock stays on the vulnerable 1.2.1 (PYSEC-2026-248/249, fix
# 1.3.0/1.3.1) even after the fastapi ceiling is raised to <0.138.0. Mirrors ml-service's already
# -verified fix (fastapi 0.137.x has a confirmed _IncludedRouter/.path breakage; fastapi<0.137.0 +
# starlette>=1.3.1 together do NOT reproduce it). Tracked:
# plans/active/issues/unified_trading_api_pip_audit_stale_ignore_list_2026_07_13.md,
# plans/active/issues/canonical_fastapi_ceiling_stale_vs_ml_service_2026_07_13.md.
override-dependencies = [
    "starlette>=1.3.1",
]

[tool.uv.sources]
unified-trading-library = { path = "../unified-trading-library", editable = true}

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true


# ── ruff (lint + format) ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811", "SIM117", "SIM105", "RUF059", "N806", "E402", "E501", "C901"]
"tests/conftest.py" = ["E402"]


# ── basedpyright (typecheck) — CONSOLIDATED; delete pyrightconfig.json ──────────
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["unified_trading_api"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
# ── Owned by ruff (avoid double-reporting) / pragmatic softenings.
# ── Repo-specific softenings (preserved from original config).

# Cross-repo import resolution (replaces pyrightconfig.json executionEnvironments).
reportAny = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownParameterType = "error"
reportUnusedFunction = "none"
reportUnusedImport = "none"
reportCallInDefaultInitializer = "none"
[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = []


# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as unit test",
    "integration: marks tests as integration tests (require GCP credentials)",
    "smoke: mark test as smoke test",
]


# ── coverage (run + report — BOTH required in every repo) ────────────────────────
[tool.coverage.run]
source = ["unified_trading_api"]
branch = true
# pytest-cov + xdist: workers are separate processes; without parallel-combine the terminal
# fail-under reads PARTIAL (controller-only) data and spuriously fails (2026-06-22: mtds saw
# terminal 46.4% while coverage.xml correctly combined to 83.95%). parallel-combine fixes the gate.
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true
omit = [
    "unified_trading_api/__main__.py",
    "unified_trading_api/main.py",
    "unified_trading_api/mock_data/seed.py",
    "unified_trading_api/mock_data/seed_strategies.py",
    "unified_trading_api/routes/websocket.py",
]

[tool.coverage.report]
fail_under = 77
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]


# ── bandit (security SAST — every repo) ──────────────────────────────────────────
[tool.bandit]
skips = []

[tool.hatch.version]
source = "vcs"
