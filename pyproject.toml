[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "unified-trading-api"
version = "0.1.0"
description = "Consolidated FastAPI serving all domain data for the Unified Trading System UIs"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "pydantic>=2.12.5,<3.0.0",
    # Auth
    "google-auth>=2.40.0,<3.0.0",
    # Metrics
    "prometheus-client>=0.20.0,<1.0.0",
    # HTTP client (proxy to deployment-api)
    "httpx>=0.28.1,<1.0.0",
    # WebSocket
    "websockets>=14.0,<15.0",
    # Internal libraries
    "unified-trading-library>=0.1.0,<1.0.0",
    "unified-events-interface>=0.1.0,<1.0.0",
    "unified-config-interface>=0.1.0,<1.0.0",
    "unified-cloud-interface>=0.1.0,<1.0.0",
    "unified-internal-contracts>=0.1.0,<1.0.0",
    "unified-api-contracts>=0.1.0,<1.0.0",
    # Test / QG
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pyjwt>=2.12.0,<3.0.0",
    "cryptography>=46.0.5",
]

[project.scripts]
unified-trading-api = "unified_trading_api.main:main"

[tool.uv.sources]
unified-trading-library = { path = "../unified-trading-library", editable = true}
unified-events-interface = { path = "../unified-events-interface", editable = true}
unified-config-interface = { path = "../unified-config-interface", editable = true}
unified-cloud-interface = { path = "../unified-cloud-interface", editable = true}
unified-internal-contracts = { path = "../unified-internal-contracts", editable = true}
unified-api-contracts = { path = "../unified-api-contracts", editable = true}

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G",
"C90",]
ignore = ["B008"]


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117", "SIM105", "F841", "RUF059", "N806", "E402", "E501", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownParameterType = "error"
reportUnusedFunction = "none"
reportUnusedImport = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: marks tests as integration tests (require GCP credentials)",
]

[tool.coverage.run]
omit = [
    "unified_trading_api/__main__.py",
    "unified_trading_api/main.py",
    "unified_trading_api/mock_data/seed.py",
    "unified_trading_api/mock_data/seed_strategies.py",
    "unified_trading_api/routes/websocket.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
